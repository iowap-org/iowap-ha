name: IOWAP Node
version: "0.2.3"
slug: iowap
description: >-
  IOWAP node container for Home Assistant OS. Registers as an IOWAP cluster
  node and executes approved home capabilities (lights, climate, state reads)
  via the HA core API through the Supervisor proxy.
url: https://github.com/iowap-org/iowap-ha
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
stdin: true
host_network: false
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true
map:
  - share:rw
options:
  relay_url: ""
  log_level: INFO
  light_entity_scope: "*"
  rate_limit_per_min: 20
  lock_level: read
  status_push_interval: 60
schema:
  relay_url: "url?"
  log_level: "list(trace|debug|INFO|WARNING|ERROR)?"
  light_entity_scope: "str?"
  rate_limit_per_min: "int(1,120)?"
  lock_level: "list(read|write)?"
  status_push_interval: "int(15,3600)?"
image: ghcr.io/iowap-org/iowap-ha-{arch}