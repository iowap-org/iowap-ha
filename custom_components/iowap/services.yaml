{
  "version": 1,
  "minor_version": 1,
  "key": "iowap",
  "name": "IOWAP",
  "services": {
    "submit_task": {
      "name": "Submit task to IOWAP cluster",
      "description": "Submits a single-stage task to the IOWAP relay via the IOWAP app (hassio.app_stdin). Capabilities visible to the HA app: e.g. agent.ai on a cluster node.",
      "fields": {
        "capability": {
          "name": "Capability",
          "description": "Capability to run, e.g. agent.ai",
          "required": true,
          "example": "agent.ai",
          "selector": {"text": null}
        },
        "payload": {
          "name": "Payload",
          "description": "JSON payload for the capability stage",
          "required": true,
          "selector": {"object": null}
        },
        "name": {
          "name": "Task name",
          "required": false,
          "selector": {"text": null}
        },
        "priority": {
          "name": "Priority",
          "description": "Lower number = sooner (scheduler semantics).",
          "required": false,
          "default": 5,
          "selector": {"number": {"min": 1, "max": 9, "mode": "slider"}}
        }
      }
    },
    "get_capabilities": {
      "name": "Get cluster capabilities",
      "description": "Returns the capabilities the IOWAP cluster currently offers (incl. input_schema), read from the server metrics entity. For scripting/automations via response_variable.",
      "response": true,
      "fields": {
        "include_schema": {
          "name": "Include input schema",
          "description": "Include each capability's input_schema in the response.",
          "required": false,
          "default": true,
          "selector": {"boolean": null}
        },
        "available_only": {
          "name": "Available only",
          "description": "Only return capabilities that currently have an available node.",
          "required": false,
          "default": false,
          "selector": {"boolean": null}
        }
      }
    }
  }
}