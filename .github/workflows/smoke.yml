name: Smoke tests

# T-265: runs the seven standalone smoke_*.py scripts at the repo root.
#
# All seven were verified to pass with outbound networking disabled
# (connect-level guard): they stub the homeassistant tree, cap httpx.post
# and use snapshot/tempdir fixtures only — no relay, no HA supervisor, no
# live infra. Each script runs as its own job so a failure in one does not
# mask another.
#
# workflow_dispatch only: no push gate — vendor-wheel/build-app-images runs
# on pushes already, and the T-265 decision keeps this explicitly manual.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - smoke_t178.py
          - smoke_int_t178.py
          - smoke_t180.py
          - smoke_t181.py
          - smoke_t182.py
          - smoke_t183.py
          - smoke_t183b.py
    name: ${{ matrix.script }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python -m pip install --quiet httpx pyyaml

      - name: Run ${{ matrix.script }}
        run: python ${{ matrix.script }}