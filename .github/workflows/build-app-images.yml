name: Build app images

# Builds the HAOS app container (iowap/config.yaml) for both arches and
# pushes to ghcr.io/iowap-org/iowap-ha-{arch}:<version from config.yaml>.
# Supervisor installs by exactly that name, so tags must match config.yaml.
# Plain buildx instead of home-assistant/builder: the legacy action is
# deprecated and its CLI flags changed under us (--system removed).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iowap/**"
      - ".github/workflows/build-app-images.yml"

env:
  IMAGE_PREFIX: ghcr.io/iowap-org/iowap-ha
  HA_BASE_TAG: "3.19"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from app config
        id: version
        run: |
          VER=$(awk -F'"' '/^version:/ {print $2; exit}' iowap/config.yaml)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building version $VER"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: iowap
          file: iowap/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}:${{ env.HA_BASE_TAG }}
          labels: |
            io.hass.type=app
            io.hass.arch=${{ matrix.arch }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max